name: Evidence boundary concern
description: Report a possible partner/private boundary issue.
title: "[Boundary concern]: "
labels: ["boundary-concern", "needs-review"]
body:
  - type: checkboxes
    id: concern
    attributes:
      label: Concern type
      options:
        - label: PHI risk
        - label: private case leakage
        - label: raw DICOM risk
        - label: clinical validation overclaim
        - label: regulatory approval overclaim
        - label: certification overclaim
        - label: Device UID / UDI-DI confusion
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Cite partner-safe files only. Do not include private case content.
    validations:
      required: true

