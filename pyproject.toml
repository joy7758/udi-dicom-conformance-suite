[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "udi-dicom-conformance-suite"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "pytest>=8.0", "jsonschema>=4.22"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
py-modules = []
